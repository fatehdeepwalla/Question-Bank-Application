<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171b31">
    <title>Library</title>
    <link rel="stylesheet" th:href="@{/question-list.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{listFragments/Portfolio_Links :: Portfolio_Links}"></div>

    <main class="page-main">
        <div th:replace="~{listFragments/About_the_App :: About_the_App}"></div>
        <div th:replace="~{listFragments/Stats :: Stats}"></div>
        <div th:replace="~{listFragments/Filters :: Filters}"></div>
        <div th:replace="~{listFragments/Heading_and_sorting :: Heading_and_sorting}"></div>
        <div th:replace="~{listFragments/Question_Items :: Question_Items}"></div>
        
        <footer class="page-footer">
            <span><span class="footer-mark">Q</span> Question Bank <span class="footer-separator">/</span> GATE CSE</span>
            <span>Keep learning. One question at a time.</span>
        </footer>
    </main>

</html>
