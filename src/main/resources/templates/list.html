<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171b31">
    <title>Library</title>
    <link rel="stylesheet" th:href="@{/question-list.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{listFragments/Portfolio_Links :: Portfolio_Links}"></div>
    <main class="page-main">
        <div class="page-alert page-alert-success" role="status"
             th:if="${successMessage}"
             th:text="${successMessage}">
            Question updated successfully.
        </div>

        <div class="page-alert page-alert-error" role="alert"
             th:if="${errorMessage}"
             th:text="${errorMessage}">
            An error occurred.
        </div>
        <div th:replace="~{listFragments/About_the_App :: About_the_App}"></div>
        <div th:replace="~{listFragments/Stats :: Stats}"></div>
        <div th:replace="~{listFragments/Filters :: Filters}"></div>
        <div th:replace="~{listFragments/Heading_Before_Questions :: Heading_Before_Questions}"></div>
        <div th:replace="~{listFragments/Question_Items :: Question_Items}"></div>
        <div th:replace="~{listFragments/Pagination :: Pagination}"></div>
        <div th:replace="~{listFragments/Footer :: Footer}"></div>


    </main>
</div>

    <script>
        (function () {
            const storageKey = "questionBank.listReturnState";

            function normalizedListUrl() {
                const url = new URL(window.location.href);
                url.searchParams.delete("_return");
                return url.pathname + url.search + url.hash;
            }

            // Save the exact viewport position before navigating to Edit.
            document.addEventListener("click", function (event) {
                const editLink = event.target.closest("a.edit-question-button");
                if (!editLink) return;

                try {
                    sessionStorage.setItem(storageKey, JSON.stringify({
                        url: normalizedListUrl(),
                        scrollX: window.scrollX,
                        scrollY: window.scrollY
                    }));
                } catch (ignored) {
                    // Navigation and return links still work if storage is unavailable.
                }
            });

            // The return marker is used only to preserve the requested page when
            // edits change the result count. Remove it from the visible URL.
            const currentUrl = new URL(window.location.href);
            if (currentUrl.searchParams.has("_return")) {
                currentUrl.searchParams.delete("_return");
                window.history.replaceState(window.history.state, "", currentUrl.pathname + currentUrl.search + currentUrl.hash);
            }

            // Restore once, only when the user has returned to the same list URL.
            try {
                const saved = JSON.parse(sessionStorage.getItem(storageKey) || "null");
                if (saved && saved.url === normalizedListUrl()) {
                    sessionStorage.removeItem(storageKey);
                    window.addEventListener("pageshow", function () {
                        requestAnimationFrame(function () {
                            window.scrollTo(saved.scrollX || 0, saved.scrollY || 0);
                        });
                    }, { once: true });
                }
            } catch (ignored) {
                // A malformed or unavailable state must never block the list.
                try { sessionStorage.removeItem(storageKey); } catch (ignoredAgain) {}
            }
        })();
    </script>

</body>
</html>
