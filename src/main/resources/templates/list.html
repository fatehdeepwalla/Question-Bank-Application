<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171b31">
    <title>Library</title>
    <link rel="stylesheet" th:href="@{/question-list.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{listFragments/Portfolio_Links :: Portfolio_Links}"></div>
    <main class="page-main">
        <div class="page-alert page-alert-success" role="status"
             th:if="${successMessage}"
             th:text="${successMessage}">
            Question updated successfully.
        </div>

        <div class="page-alert page-alert-error" role="alert"
             th:if="${errorMessage}"
             th:text="${errorMessage}">
            An error occurred.
        </div>
        <div th:replace="~{listFragments/About_the_App :: About_the_App}"></div>
        <div th:replace="~{listFragments/Stats :: Stats}"></div>
        <div th:replace="~{listFragments/Filters :: Filters}"></div>
        <div th:replace="~{listFragments/Heading_Before_Questions :: Heading_Before_Questions}"></div>
        <div th:replace="~{listFragments/Question_Items :: Question_Items}"></div>
        <div th:replace="~{listFragments/Pagination :: Pagination}"></div>
        <div th:replace="~{listFragments/Footer :: Footer}"></div>


    </main>
</div>
</body>
</html>
